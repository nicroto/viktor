<div class="mixer control-bank text-center" ng-controller="MixerCtrl as mixer">
	<div class="oscillator row">
		<h5>Osc 1</h5>
		<div class="col-xs-6">
			<webaudio-switch src="images/switch.png" width="30" height="30"
				bind-polymer
				update-control-value
				update-number-value
				value="{{mixer.volume1.enabled.value}}"></webaudio-switch>
		</div>
		<div class="col-xs-6">
			<webaudio-knob src="images/0-100-knob.png"
				bind-polymer
				knob-redraw
				update-number-value
				value="{{mixer.volume1.level.value}}" min="{{mixer.volume1.level.range[ 0 ]}}" max="{{mixer.volume1.level.range[ 1 ]}}" step="1" diameter="100" sprites="44" width="50" height="50"></webaudio-knob>
		</div>
	</div>
	<div class="oscillator row">
		<h5>Osc 2</h5>
		<div class="col-xs-6">
			<webaudio-switch src="images/switch.png" width="30" height="30"
				bind-polymer
				update-control-value
				update-number-value
				value="{{mixer.volume2.enabled.value}}"></webaudio-switch>
		</div>
		<div class="col-xs-6">
			<webaudio-knob src="images/0-100-knob.png"
				bind-polymer
				knob-redraw
				update-number-value
				value="{{mixer.volume2.level.value}}" min="{{mixer.volume2.level.range[ 0 ]}}" max="{{mixer.volume2.level.range[ 1 ]}}" step="1" diameter="100" sprites="44" width="50" height="50"></webaudio-knob>
		</div>
	</div>
	<div class="oscillator row">
		<h5>Osc 3</h5>
		<div class="col-xs-6">
			<webaudio-switch src="images/switch.png" width="30" height="30"
				bind-polymer
				update-control-value
				update-number-value
				value="{{mixer.volume3.enabled.value}}"></webaudio-switch>
		</div>
		<div class="col-xs-6">
			<webaudio-knob src="images/0-100-knob.png"
				bind-polymer
				knob-redraw
				update-number-value
				value="{{mixer.volume3.level.value}}" min="{{mixer.volume3.level.range[ 0 ]}}" max="{{mixer.volume3.level.range[ 1 ]}}" step="1" diameter="100" sprites="44" width="50" height="50"></webaudio-knob>
		</div>
	</div>
	<div class="row">
		<div class="col-xs-6">On/Off</div>
		<div class="col-xs-6">Volume</div>
	</div>
	<h4>Mixer</h4>
</div>
